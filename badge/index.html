<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sakuga Badge</title>
<style>
  :root { --page: #ffffff; --text: #1d1a4a; --mute: #8580b0; }
  html { overflow-x: clip; background: var(--page); }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--page); color: var(--text); font: 15px/1.45 -apple-system, "Helvetica Neue", "Segoe UI", sans-serif; overflow-x: clip; }
  main { width: min(640px, 100vw - 32px); padding: 40px 0 60px; }
  h1 { margin: 0; font: italic 800 26px/1.1 "Avenir Next", "Nunito", -apple-system, "Segoe UI", sans-serif; }
  .sub { margin: 4px 0 0; color: var(--mute); }
  .stage { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 18px; min-height: 220px; padding: 40px 0; }
  .hint, .said { margin: 0 4px; color: var(--mute); } .said { min-height: 1.45em; margin-top: 8px; font-size: 13px; }
  .btn { padding: 8px 14px; border: 2.6px solid #1d1a4a; border-radius: 12px; background: #fff; box-shadow: 4px 4px 0 #b8b3ff; font: 700 13.5px/1.2 -apple-system, "Segoe UI", sans-serif; color: #1d1a4a; cursor: pointer; }
  code { font-size: 13px; }
  .embed body { place-items: start center; min-height: 0; } .embed h1, .embed .sub, .embed .hint { display: none; } .embed main { padding: 0; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>Badge</h1>
  <p class="sub">A status pill that pops with a glint on update and shrinks away when dismissed.</p>
  <div class="stage">
    <sakuga-badge id="el" tone="primary" dot>WebHID</sakuga-badge>
    <sakuga-badge id="el2" tone="accent" dismissible>RT Ready</sakuga-badge>
    <button class="btn" id="cycle" type="button">Switch channel</button>
  </div>
  <p class="hint">Click Switch channel to pop a status update, or click × to dismiss the tag.</p>
  <p class="said" aria-live="polite"></p>
</main>
<script src="badge.js"></script>
<script>
const Q = new URLSearchParams(location.search), el = document.getElementById('el'), el2 = document.getElementById('el2');
if (Q.get('embed') === '1') document.documentElement.classList.add('embed');
const say = (t) => { document.querySelector('.said').textContent = t; };
const states = [['primary', 'WebHID'], ['accent', 'HTTP Local'], ['ink', 'Demo Mode'], ['neutral', 'Offline']];
let idx = 0;
document.getElementById('cycle').addEventListener('click', () => {
  idx = (idx + 1) % states.length;
  el.textContent = states[idx][1];
  el.tone = states[idx][0];
  say('tone: ' + states[idx][0] + ' (' + states[idx][1] + ')');
});
el2.addEventListener('sakuga:dismiss', () => say('sakuga:dismiss'));
</script>
</body>
</html>
