<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sakuga Hold Button</title>
<style>
  :root { --page: #ffffff; --text: #1d1a4a; --mute: #8580b0; }
  html { overflow-x: clip; background: var(--page); }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--page); color: var(--text); font: 15px/1.45 -apple-system, "Helvetica Neue", "Segoe UI", sans-serif; overflow-x: clip; }
  main { width: min(640px, 100vw - 32px); padding: 40px 0 60px; }
  h1 { margin: 0; font: italic 800 26px/1.1 "Avenir Next", "Nunito", -apple-system, "Segoe UI", sans-serif; }
  .sub { margin: 4px 0 0; color: var(--mute); }
  .stage { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 24px; min-height: 260px; padding: 40px 0; }
  .hint, .said { margin: 0 4px; color: var(--mute); } .said { min-height: 1.45em; margin-top: 8px; font-size: 13px; }
  .reset-link { background: none; border: 0; padding: 0; color: var(--text); font: inherit; text-decoration: underline; cursor: pointer; }
  code { font-size: 13px; }
  .embed body { place-items: start center; min-height: 0; } .embed h1, .embed .sub, .embed .hint { display: none; } .embed main { padding: 0; }
</style>
</head>
<body>
<main>
  <h1>Hold Button</h1>
  <p class="sub">Press and hold to charge an impact; release early to cancel.</p>
  <div class="stage">
    <sakuga-hold-button id="el" duration="900">Hold to Confirm</sakuga-hold-button>
  </div>
  <p class="hint">Hold for 0.9 seconds (with pointer or Space/Enter). <button class="reset-link" id="reset" type="button">Reset</button> to try again.</p>
  <p class="said" aria-live="polite"></p>
</main>
<script src="hold-button.js"></script>
<script>
const Q = new URLSearchParams(location.search), el = document.getElementById('el');
if (Q.get('embed') === '1') document.documentElement.classList.add('embed');
const say = (t) => { document.querySelector('.said').textContent = t; };
el.addEventListener('sakuga:confirm', () => say('sakuga:confirm'));
el.addEventListener('sakuga:cancel', (e) => say(`sakuga:cancel (${Math.round(e.detail.progress * 100)}%)`));
document.getElementById('reset').addEventListener('click', () => { el.reset(); say('reset'); });
</script>
</body>
</html>
