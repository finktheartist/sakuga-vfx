<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sakuga Mascot</title>
<style>
  :root { --page: #ffffff; --text: #1d1a4a; --mute: #8580b0; --line: #1d1a4a; --soft: #b8b3ff; }
  html { overflow-x: clip; background: var(--page); }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--page); color: var(--text); font: 15px/1.45 -apple-system, "Helvetica Neue", "Segoe UI", sans-serif; overflow-x: clip; }
  main { width: min(640px, 100vw - 32px); padding: 40px 0 60px; }
  h1 { margin: 0; font: italic 800 26px/1.1 "Avenir Next", "Nunito", -apple-system, "Segoe UI", sans-serif; }
  .sub { margin: 4px 0 0; color: var(--mute); }
  .stage { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 24px; min-height: 270px; padding: 60px 0 24px; }
  .controls { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-bottom: 18px; }
  .controls button {
    padding: 8px 14px; border: 2.5px solid var(--line); border-radius: 10px;
    background: #fff; color: var(--text); font: 700 13px/1.2 inherit; cursor: pointer;
    box-shadow: 3px 3px 0 var(--soft);
  }
  .controls button:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--soft); }
  .hint, .said { margin: 0 4px; color: var(--mute); text-align: center; } .said { min-height: 1.45em; margin-top: 8px; font-size: 13px; }
  .embed body { place-items: start center; min-height: 0; } .embed h1, .embed .sub, .embed .hint { display: none; } .embed main { padding: 0; }
</style>
</head>
<body>
<main>
  <h1>Mascot</h1>
  <p class="sub">An anime buddy with springy ears, expressions, speech bubbles, and combo bursts.</p>
  <div class="stage">
    <sakuga-mascot id="el" messages='["Yosh! Let&apos;s build!","Tap fast for a combo!","Two tones &amp; bold ink!","Sakuga power!"]'></sakuga-mascot>
  </div>
  <div class="controls">
    <button type="button" data-mood="happy">Happy</button>
    <button type="button" data-mood="shock">Shock</button>
    <button type="button" data-mood="fire">Fire Up</button>
    <button type="button" data-mood="sleepy">Sleepy</button>
  </div>
  <p class="hint">Click the mascot to cheer (rapid-click 3+ times for Hyper Combo), or trigger a mood above.</p>
  <p class="said" aria-live="polite"></p>
</main>
<script src="mascot.js"></script>
<script>
const Q = new URLSearchParams(location.search), el = document.getElementById('el');
if (Q.get('embed') === '1') document.documentElement.classList.add('embed');
const say = (t) => { document.querySelector('.said').textContent = t; };
el.addEventListener('sakuga:cheer', (e) => say(`cheer x${e.detail.combo}: "${e.detail.message}"`));
document.querySelectorAll('[data-mood]').forEach((btn) => {
  btn.addEventListener('click', () => {
    const m = btn.dataset.mood;
    el.react(m);
    const lines = { happy: 'Yay!!', shock: 'NANI?!', fire: 'GOGOGO!!', sleepy: 'Zzz...' };
    el.say(lines[m]);
    say(`react("${m}")`);
  });
});
</script>
</body>
</html>
