<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sakuga Menu</title>
<style>
  :root { --page: #ffffff; --text: #1d1a4a; --mute: #8580b0; }
  html { overflow-x: clip; background: var(--page); }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--page); color: var(--text); font: 15px/1.45 -apple-system, "Helvetica Neue", "Segoe UI", sans-serif; overflow-x: clip; }
  main { width: min(640px, 100vw - 32px); padding: 40px 0 60px; }
  h1 { margin: 0; font: italic 800 26px/1.1 "Avenir Next", "Nunito", -apple-system, "Segoe UI", sans-serif; }
  .sub { margin: 4px 0 0; color: var(--mute); }
  .stage { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: center; gap: 24px; min-height: 290px; padding: 56px 0 40px; }
  .hint, .said { margin: 0 4px; color: var(--mute); } .said { min-height: 1.45em; margin-top: 8px; font-size: 13px; }
  code { font-size: 13px; }
  .embed body { place-items: start center; min-height: 0; } .embed h1, .embed .sub, .embed .hint { display: none; } .embed main { padding: 0; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>Menu</h1>
  <p class="sub">An action menu that springs open with a ring and puffs, and confirms with ポン.</p>
  <div class="stage">
    <sakuga-menu id="el" label="Profile">
      <option value="apply">Apply to keyboard</option>
      <option value="duplicate">Duplicate profile</option>
      <option value="export">Export JSON</option>
      <hr>
      <option value="delete" data-tone="danger">Delete</option>
    </sakuga-menu>
  </div>
  <p class="hint">Click the trigger, or use Arrow keys, Enter and Escape.</p>
  <p class="said" aria-live="polite"></p>
</main>
<script src="menu.js"></script>
<script>
const Q = new URLSearchParams(location.search), el = document.getElementById('el');
if (Q.get('embed') === '1') document.documentElement.classList.add('embed');
const say = (t) => { document.querySelector('.said').textContent = t; };
el.addEventListener('sakuga:select', (e) => say(`sakuga:select: ${e.detail.label} (${e.detail.value})`));
</script>
</body>
</html>
